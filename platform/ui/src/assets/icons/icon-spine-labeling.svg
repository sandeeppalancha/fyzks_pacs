<svg width="20" height="20" viewBox="0 0 20 20" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <g fill="none" fill-rule="evenodd">
        <rect width="20" height="20" fill="none"/>
        <g transform="translate(4, 2)" stroke="#348CFD" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
            <!-- Wavy central line representing spine curvature -->
            <path d="M6,1 C 6,1 7,3 6,5 C 5,7 7,9 6,11 C 5,13 6,15 6,15" />

            <!-- Vertebrae representations -->
